name: Agent regenerate public API for PR 2890

on:
  push:
    branches:
      - agent/regen-public-api-2890

permissions:
  contents: write

jobs:
  update-public-api:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out helper branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Update iceberg public API snapshot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/iceberg/public-api.txt")
          text = path.read_text()
          marker = "pub iceberg::ErrorKind::NamespaceNotEmpty\n"
          before = (
              "pub iceberg::ErrorKind::NamespaceAlreadyExists\n"
              "pub iceberg::ErrorKind::NamespaceNotFound\n"
          )
          after = (
              "pub iceberg::ErrorKind::NamespaceAlreadyExists\n"
              "pub iceberg::ErrorKind::NamespaceNotEmpty\n"
              "pub iceberg::ErrorKind::NamespaceNotFound\n"
          )

          if marker in text:
              raise SystemExit("NamespaceNotEmpty is already present in the snapshot")
          if text.count(before) != 1:
              raise SystemExit("Expected ErrorKind insertion anchor exactly once")

          path.write_text(text.replace(before, after, 1))
          PY

      - name: Commit generated snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/iceberg/public-api.txt
          git diff --cached --check
          git commit -m "chore: regenerate public API"
          git push origin "HEAD:${{ github.ref_name }}"
